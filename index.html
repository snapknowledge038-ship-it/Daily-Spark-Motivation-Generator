<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Spark | Motivation Generator</title>
    
    <!-- External Resources -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            overflow: hidden;
        }

        .main-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 10px #e94560;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 5px #e94560, 0 0 10px #e94560; opacity: 1; }
            50% { text-shadow: 0 0 20px #e94560, 0 0 30px #ff2e63; opacity: 0.7; }
        }

        /* Capture කරන්න ඕන කොටස */
        #capture-area {
            padding: 20px;
            background: transparent;
            display: flex;
            justify-content: center;
        }

        .quote-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }

        .quote-icon {
            font-size: 35px;
            color: #e94560;
            margin-bottom: 20px;
        }

        #quote {
            font-size: 1.4rem;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 15px;
            min-height: 80px;
        }

        #author {
            display: block;
            font-style: italic;
            color: #e94560;
            margin-bottom: 10px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: center;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-next {
            background: #e94560;
            color: white;
        }

        .btn-download {
            background: #28a745;
            color: white;
        }

        button:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }
    </style>
</head>
<body>

    <h1 class="main-title">Daily Spark</h1>

    <div id="capture-area">
        <div class="quote-box">
            <i class="fas fa-quote-left quote-icon"></i>
            <div class="text-area">
                <p id="quote">"සාර්ථකත්වයේ රහස වන්නේ අරමුණක් ඇතිව වැඩ කිරීමයි."</p>
                <span id="author">- සසංකර</span>
            </div>
        </div>
    </div>

    <div class="button-group">
        <button class="btn-next" id="new-quote">
            <i class="fas fa-sync-alt"></i> තව එකක්
        </button>
        <button class="btn-download" id="download-btn">
            <i class="fas fa-download"></i> Save Image
        </button>
    </div>

    <script>
        const quotes = [
            { text: "සාර්ථකත්වය යනු වැටෙන වාරයක් පාසා නැවත නැගී සිටීමයි.", author: "වින්ස්ටන් චර්චිල්" },
            { text: "ඔබේ සිහිනය වෙනුවෙන් අද දවසේ යමක් කරන්න.", author: "ස්ටීව් ජොබ්ස්" },
            { text: "අසීරු මාවත් සැමවිටම සුන්දර ගමනාන්ත කරා ඔබව රැගෙන යයි.", author: "සිග් සිග්ලර්" },
            { text: "වෙනසක් වීමට අවශ්‍ය නම්, වෙනස් විදිහට සිතන්න පටන් ගන්න.", author: "අල්බර්ට් අයින්ස්ටයින්" }
        ];

        const quoteText = document.getElementById("quote");
        const authorText = document.getElementById("author");
        const btnNext = document.getElementById("new-quote");
        const btnDownload = document.getElementById("download-btn");

        // නිව් Quote එකක් ගැනීම
        btnNext.addEventListener("click", () => {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            quoteText.style.opacity = 0;
            setTimeout(() => {
                quoteText.innerText = `"${quotes[randomIndex].text}"`;
                authorText.innerText = `- ${quotes[randomIndex].author}`;
                quoteText.style.opacity = 1;
            }, 300);
        });

        // Screenshot එකක් ලෙස Download කිරීම
        btnDownload.addEventListener("click", () => {
            const element = document.getElementById("capture-area");
            
            html2canvas(element, {
                backgroundColor: null, // Transparent background
                scale: 2 // Quality එක වැඩි කිරීමට
            }).then(canvas => {
                const link = document.createElement("a");
                link.download = "motivation-quote.png";
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        });
    </script>
</body>
</html>
