<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Spark | Motivation Generator</title>
    
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0b0d17; /* තද අඳුරු පැහැය */
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* --- Stars Animation Styles --- */
        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Content එකට පිටුපසින් තැබීමට */
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        }

        /* තරු නිර්මාණය (CSS Box Shadows පාවිච්චි කරලා) */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: animateStar linear infinite;
        }

        @keyframes animateStar {
            from { transform: translateY(0px); }
            to { transform: translateY(-1000px); } /* ඉහළට ගමන් කිරීම */
        }

        /* --- Content Styles --- */
        .main-title {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 10px #e94560;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px #e94560, 0 0 20px #e94560; opacity: 1; }
            50% { text-shadow: 0 0 30px #e94560, 0 0 40px #ff2e63; opacity: 0.8; }
        }

        .quote-box {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 45px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            width: 90%;
            max-width: 480px;
            z-index: 10;
        }

        .quote-icon {
            font-size: 35px;
            color: #e94560;
            margin-bottom: 25px;
        }

        #quote {
            font-size: 1.5rem;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 20px;
            min-height: 90px;
            transition: 0.4s;
        }

        #author {
            display: block;
            font-style: italic;
            color: #e94560;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
        }

        button {
            border: none;
            padding: 14px 24px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-next { background: #e94560; }
        .btn-copy { background: #1f4068; }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            filter: brightness(1.2);
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.4);
        }

        #toast {
            visibility: hidden;
            background-color: #28a745;
            color: #fff;
            text-align: center;
            border-radius: 50px;
            padding: 12px 25px;
            position: fixed;
            bottom: 30px;
            font-size: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        #toast.show {
            visibility: visible;
            animation: fadeInOut 2.5s;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; bottom: 0; }
            20% { opacity: 1; bottom: 30px; }
            80% { opacity: 1; bottom: 30px; }
            100% { opacity: 0; bottom: 0; }
        }
    </style>
</head>
<body>

    <!-- Background Stars -->
    <div class="stars-container" id="stars"></div>

    <h1 class="main-title">Daily Spark</h1>

    <div class="quote-box">
        <i class="fas fa-quote-left quote-icon"></i>
        <div class="text-area">
            <p id="quote">"සාර්ථකත්වයේ රහස වන්නේ අරමුණක් ඇතිව වැඩ කිරීමයි."</p>
            <span id="author">- සසංකර</span>
        </div>
        
        <div class="button-group">
            <button class="btn-next" id="new-quote">
                <i class="fas fa-sync-alt"></i> තව එකක්
            </button>
            <button class="btn-copy" id="copy-btn">
                <i class="fas fa-copy"></i> Copy Text
            </button>
        </div>
    </div>

    <div id="toast">Quote එක Copy කළා! ✅</div>

    <script>
        // --- තරු නිර්මාණය කිරීමේ Logic එක ---
        function createStars() {
            const container = document.getElementById('stars');
            const starCount = 150; // තරු ගණන

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                // Random ප්‍රමාණය (1px - 3px)
                const size = Math.random() * 3 + 'px';
                star.style.width = size;
                star.style.height = size;
                
                // Random පිහිටීම
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                
                // Random Animation වේගය
                const duration = Math.random() * 50 + 50 + 's';
                star.style.animationDuration = duration;
                
                // Random Delay එකක් (එක පාර ඔක්කොම යන්නේ නැති වෙන්න)
                star.style.animationDelay = Math.random() * -100 + 's';

                container.appendChild(star);
            }
        }
        createStars();

        // --- Quotes Logic ---
        const quotes = [
            { text: "සාර්ථකත්වය යනු වැටෙන වාරයක් පාසා නැවත නැගී සිටීමයි.", author: "වින්ස්ටන් චර්චිල්" },
            { text: "ඔබේ සිහිනය වෙනුවෙන් අද දවසේ යමක් කරන්න.", author: "ස්ටීව් ජොබ්ස්" },
            { text: "අසීරු මාවත් සැමවිටම සුන්දර ගමනාන්ත කරා ඔබව රැගෙන යයි.", author: "සිග් සිග්ලර්" },
            { text: "වෙනසක් වීමට අවශ්‍ය නම්, වෙනස් විදිහට සිතන්න පටන් ගන්න.", author: "අල්බර්ට් අයින්ස්ටයින්" },
            { text: "ජයග්‍රහණය යනු පැරදීමට බිය නොවීමයි.", author: "මෝටිවේෂන් සිංහල" }
        ];

        const quoteText = document.getElementById("quote");
        const authorText = document.getElementById("author");
        const btnNext = document.getElementById("new-quote");
        const btnCopy = document.getElementById("copy-btn");
        const toast = document.getElementById("toast");

        btnNext.addEventListener("click", () => {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            quoteText.style.opacity = 0;
            authorText.style.opacity = 0;
            
            setTimeout(() => {
                quoteText.innerText = `"${quotes[randomIndex].text}"`;
                authorText.innerText = `- ${quotes[randomIndex].author}`;
                quoteText.style.opacity = 1;
                authorText.style.opacity = 1;
            }, 300);
        });

        btnCopy.addEventListener("click", () => {
            const fullText = `${quoteText.innerText} ${authorText.innerText}`;
            navigator.clipboard.writeText(fullText).then(() => {
                toast.className = "show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2500);
            });
        });
    </script>
</body>
</html>
