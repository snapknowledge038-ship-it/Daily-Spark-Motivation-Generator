<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Spark | Motivation Generator</title>
    
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0b0d17; /* තද අඳුරු පැහැය */
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* --- Stars Animation Styles --- */
        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Content එකට පිටුපසින් තැබීමට */
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        }

        /* තරු නිර්මාණය (CSS Box Shadows පාවිච්චි කරලා) */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: animateStar linear infinite;
        }

        @keyframes animateStar {
            from { transform: translateY(0px); }
            to { transform: translateY(-1000px); } /* ඉහළට ගමන් කිරීම */
        }

        /* --- Content Styles --- */
        .main-title {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 10px #e94560;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px #e94560, 0 0 20px #e94560; opacity: 1; }
            50% { text-shadow: 0 0 30px #e94560, 0 0 40px #ff2e63; opacity: 0.8; }
        }

        .quote-box {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 45px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            width: 90%;
            max-width: 480px;
            z-index: 10;
        }

        .quote-icon {
            font-size: 35px;
            color: #e94560;
            margin-bottom: 25px;
        }

        #quote {
            font-size: 1.5rem;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 20px;
            min-height: 90px;
            transition: 0.4s;
        }

        #author {
            display: block;
            font-style: italic;
            color: #e94560;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
        }

        button {
            border: none;
            padding: 14px 24px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-next { background: #e94560; }
        .btn-copy { background: #1f4068; }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            filter: brightness(1.2);
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.4);
        }

        #toast {
            visibility: hidden;
            background-color: #28a745;
            color: #fff;
            text-align: center;
            border-radius: 50px;
            padding: 12px 25px;
            position: fixed;
            bottom: 30px;
            font-size: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        #toast.show {
            visibility: visible;
            animation: fadeInOut 2.5s;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; bottom: 0; }
            20% { opacity: 1; bottom: 30px; }
            80% { opacity: 1; bottom: 30px; }
            100% { opacity: 0; bottom: 0; }
        }
    </style>
</head>
<body>

    <!-- Background Stars -->
    <div class="stars-container" id="stars"></div>

    <h1 class="main-title">Daily Spark</h1>

    <div class="quote-box">
        <i class="fas fa-quote-left quote-icon"></i>
        <div class="text-area">
            <p id="quote">"සාර්ථකත්වයේ රහස වන්නේ අරමුණක් ඇතිව වැඩ කිරීමයි."</p>
            <span id="author">- සසංකර</span>
        </div>
        
        <div class="button-group">
            <button class="btn-next" id="new-quote">
                <i class="fas fa-sync-alt"></i> තව එකක්
            </button>
            <button class="btn-copy" id="copy-btn">
                <i class="fas fa-copy"></i> Copy Text
            </button>
        </div>
    </div>

    <div id="toast">Quote එක Copy කළා! ✅</div>

    <script>
        // --- තරු නිර්මාණය කිරීමේ Logic එක ---
        function createStars() {
            const container = document.getElementById('stars');
            const starCount = 150; // තරු ගණන

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                // Random ප්‍රමාණය (1px - 3px)
                const size = Math.random() * 3 + 'px';
                star.style.width = size;
                star.style.height = size;
                
                // Random පිහිටීම
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                
                // Random Animation වේගය
                const duration = Math.random() * 50 + 50 + 's';
                star.style.animationDuration = duration;
                
                // Random Delay එකක් (එක පාර ඔක්කොම යන්නේ නැති වෙන්න)
                star.style.animationDelay = Math.random() * -100 + 's';

                container.appendChild(star);
            }
        }
        createStars();

        // --- Quotes Logic ---
        const quotes = [
    { text: "සාර්ථකත්වය යනු වැටෙන වාරයක් පාසා නැවත නැගී සිටීමයි.", author: "වින්ස්ටන් චර්චිල්" },
    { text: "ඔබේ සිහිනය වෙනුවෙන් අද දවසේ යමක් කරන්න.", author: "ස්ටීව් ජොබ්ස්" },
    { text: "අසීරු මාවත් සැමවිටම සුන්දර ගමනාන්ත කරා ඔබව රැගෙන යයි.", author: "සිග් සිග්ලර්" },
    { text: "වෙනසක් වීමට අවශ්‍ය නම්, වෙනස් විදිහට සිතන්න පටන් ගන්න.", author: "අල්බර්ට් අයින්ස්ටයින්" },
    { text: "ජයග්‍රහණය යනු පැරදීමට බිය නොවීමයි.", author: "මෝටිවේෂන් සිංහල" },
    { text: "අසමත් වීම යනු නැවත වඩාත් බුද්ධිමත්ව ආරම්භ කිරීමට ඇති අවස්ථාවයි.", author: "හෙන්රි ෆෝර්ඩ්" },
    { text: "ඔබට කළ නොහැකි දේ, ඔබට කළ හැකි දේට බාධාවක් වීමට ඉඩ නොදෙන්න.", author: "ජෝන් වුඩන්" },
    { text: "විශ්වාසයෙන් යුතුව ඔබේ සිහින දෙසට ගමන් කරන්න.", author: "හෙන්රි ඩේවිඩ් තෝරෝ" },
    { text: "අනාගතය අයිති වන්නේ ඔවුන්ගේ සිහිනවල සුන්දරත්වය විශ්වාස කරන අයටයි.", author: "එලිනෝර් රූස්වෙල්ට්" },
    { text: "වෙනසක් වීමට නම් මුලින්ම ඔබ වෙනස් විය යුතුය.", author: "මහත්මා ගාන්ධි" },
    { text: "ඔබට යමක් සිහින දැකීමට හැකි නම්, ඔබට එය කළ හැකිය.", author: "වෝල්ට් ඩිස්නි" },
    { text: "අපගේ අනාගතය තීරණය වන්නේ අප අද ගන්නා තීරණ මතයි.", author: "බුදුන් වහන්සේ" },
    { text: "සෑම දිනක්ම ඔබේ ජීවිතයේ හොඳම දිනය වීමට අවස්ථාවක් දෙන්න.", author: "මාර්ක් ට්වේන්" },
    { text: "සතුට යනු දැනටමත් සූදානම් කර ඇති දෙයක් නොවේ. එය පැමිණෙන්නේ ඔබේම ක්‍රියාවන්ගෙනි.", author: "දලයි ලාමා" },
    { text: "අත්නොහරින කෙනෙකුව පරාජය කිරීම අපහසුය.", author: "බේබ් රූත්" },
    { text: "කාලය සීමිතයි, එබැවින් වෙනත් අයෙකුගේ ජීවිතයක් ජීවත් වෙමින් එය අපතේ නොයවන්න.", author: "ස්ටීව් ජොබ්ස්" },
    { text: "අධ්‍යාපනය යනු ලෝකය වෙනස් කිරීමට භාවිතා කළ හැකි බලවත්ම ආයුධයයි.", author: "නෙල්සන් මැන්ඩෙලා" },
    { text: "පැය විසිහතරක් යනු ඔබට ලෝකය වෙනස් කිරීමට ලැබෙන කාලයයි.", author: "එරික් තෝමස්" },
    { text: "සාර්ථකත්වය යනු අවසානය නොවේ, අසාර්ථකත්වය මාරාන්තික නොවේ.", author: "වින්ස්ටන් චර්චිල්" },
    { text: "ඔබ කරන දේට ඔබ ආදරය කරන්නේ නම් මිස ඔබට විශාල දෙයක් කළ නොහැක.", author: "ස්ටීව් ජොබ්ස්" },
    { text: "විශාල සිහින දකින්න, වෙහෙස මහන්සි වී වැඩ කරන්න.", author: "අනෝන්" },
    { text: "වැටෙන සෑම වතාවකම නැවත නැගිටින්න.", author: "කන්ෆියුසියස්" },
    { text: "අද ඔබ කරන දේ ඔබේ හෙට දවස තීරණය කරයි.", author: "අයිසැක් නිව්ටන්" },
    { text: "බාධක යනු ඔබ ඉලක්කයෙන් ඇස් ඉවතට ගත් විට දකින බියජනක දේවල්ය.", author: "හෙන්රි ෆෝර්ඩ්" },
    { text: "ඔබේ සීමාවන් ඇත්තේ ඔබේ මනස තුළ පමණි.", author: "අනෝන්" },
    { text: "නිහඬව වැඩ කරන්න, ඔබේ සාර්ථකත්වයට ශබ්ද කිරීමට ඉඩ දෙන්න.", author: "ෆ්‍රෑන්ක් ඕෂන්" },
    { text: "සැබෑ පරාජිතයා යනු තමන්ට දිනන්න බැරි බව සිතා උත්සාහය අත්හරින කෙනාය.", author: "මොහොමඩ් අලි" },
    { text: "ප්‍රශ්න දෙස නොව විසඳුම් දෙස බලන්න.", author: "ටෝනි රොබින්ස්" },
    { text: "මම අසාර්ථක වී නැත. මම වැඩ නොකරන ක්‍රම 10,000ක් සොයා ගත්තෙමි.", author: "තෝමස් එඩිසන්" },
    { text: "උත්සාහය අත්නොහරින්න, හොඳම දේ තවම සිදුවී නැත.", author: "අනෝන්" },
    { text: "ජීවිතය යනු තමන්ව සෙවීම නොව, තමන්ව නිර්මාණය කර ගැනීමයි.", author: "ජෝර්ජ් බර්නාඩ් ෂෝ" },
    { text: "ඔබට දිනන්නට අවශ්‍ය නම්, පරාජය වීමට ඇති බිය නැති කරගන්න.", author: "රොබට් කියෝසාකි" },
    { text: "පොරොන්දු නොවන්න, ඔප්පු කර පෙන්වන්න.", author: "අනෝන්" },
    { text: "සෑම ප්‍රවීණයෙකුම වරෙක ආරම්භකයෙකි.", author: "හෙලන් හේස්" },
    { text: "ඔබේ මනස පාලනය කරන්න, නැතිනම් එය ඔබව පාලනය කරනු ඇත.", author: "නැපෝලියන් හිල්" },
    { text: "මහා දේවල් කිරීමට පෙර කුඩා දේවල් විශිෂ්ට ලෙස කරන්න.", author: "නැපෝලියන් හිල්" },
    { text: "අන් අය කරන දේ ගැන නොව, ඔබ කරන දේ ගැන අවධානය යොමු කරන්න.", author: "අනෝන්" },
    { text: "සාර්ථකත්වයේ එකම රහස සූදානමයි.", author: "බොබී නයිට්" },
    { text: "අද දවස ඔබේ උපරිමයෙන් ජීවත් වන්න.", author: "ජෝන් ලෙනන්" },
    { text: "දෛවය යනු අවස්ථාවක් නොව තේරීමකි.", author: "විලියම් ජෙනින්ග්ස් බ්‍රයන්" },
    { text: "ඔබේ ආකල්පය ඔබේ උස තීරණය කරයි.", author: "සිග් සිග්ලර්" },
    { text: "කවදාවත් නොපැරදුණු මිනිසා කිසිවක් අලුතින් කර නැති මිනිසෙකි.", author: "අල්බර්ට් අයින්ස්ටයින්" },
    { text: "වේදනාව තාවකාලිකයි, ජයග්‍රහණය සදාකාලිකයි.", author: "ලැන්ස් ආම්ස්ට්‍රෝං" },
    { text: "ඔබ වැඩ කරන තාක් කල් කිසිවක් කළ නොහැකි නොවේ.", author: "මාර්ටින් ලූතර් කින්ග්" },
    { text: "නොහැකියාව යනු මතයක් පමණි.", author: "මොහොමඩ් අලි" },
    { text: "ඔබේ ඉලක්කය විශාල නම්, ඔබේ උත්සාහයද විශාල විය යුතුය.", author: "අනෝන්" },
    { text: "අමාරුම දේ ආරම්භ කිරීමයි.", author: "අනෝන්" },
    { text: "සැබෑ දැනුම ඇත්තේ ක්‍රියාව තුළයි.", author: "ලියනාඩෝ ඩා වින්චි" },
    { text: "ඔබේ මාවත ඔබම සොයා ගන්න.", author: "අනෝන්" },
    { text: "අවදානමක් නොගන්නා තැනැත්තා කිසිවක් කරන්නේ නැත.", author: "ලියෝ බුස්කාලියා" },
    { text: "සාර්ථකත්වය යනු කුඩා උත්සාහයන් දිනපතා නැවත නැවත කිරීමේ ප්‍රතිඵලයකි.", author: "රොබට් කොලියර්" },
    { text: "තව ටිකක් උත්සාහ කරන්න.", author: "අනෝන්" },
    { text: "ඔබේ සතුරන්ව ජය ගැනීමට ඇති හොඳම ක්‍රමය සාර්ථක වීමයි.", author: "අනෝන්" },
    { text: "ජයග්‍රහණය යනු පරාජයන් අතරින් උද්‍යෝගය නැති කර නොගෙන ගමන් කිරීමයි.", author: "වින්ස්ටන් චර්චිල්" },
    { text: "අනාගතය නිර්මාණය කිරීමට ඇති හොඳම ක්‍රමය එය ගොඩනැගීමයි.", author: "ඒබ්‍රහම් ලින්කන්" },
    { text: "ඔබ යමක් ආරම්භ කළ යුත්තේ එය කිරීමට සුදුසුම වේලාව පැමිණෙන තෙක් නොවේ.", author: "අනෝන්" },
    { text: "ජීවිතය කෙටියි, එය අර්ථවත් කරන්න.", author: "අනෝන්" },
    { text: "කිසිවෙකුට ඔබව පහත් කළ නොහැක.", author: "මහත්මා ගාන්ධි" },
    { text: "සෑම අඳුරු වලාකුළකටම රිදී රේඛාවක් ඇත.", author: "ජෝන් මිල්ටන්" },
    { text: "උත්සාහය අතහැරීම පරාජය වීමට වඩා වේදනාකාරී විය හැක.", author: "අනෝන්" },
    { text: "හොඳම පළිය වන්නේ විශාල ලෙස සාර්ථක වීමයි.", author: "ෆ්‍රෑන්ක් සිනාත්‍රා" },
    { text: "අද ඔබ හඩන දේ හෙට ඔබේ සිනහවට හේතුව විය හැක.", author: "අනෝන්" },
    { text: "මිනිසාගේ සීමාව ඔහු පනවා ගන්නා සීමාවයි.", author: "අනෝන්" },
    { text: "දක්ෂතාවයට වඩා උත්සාහය වැදගත් වේ.", author: "කෙවින් ඩියුරන්ට්" },
    { text: "වෙනස් වීමට ඇති හොඳම කාලය දැන්ය.", author: "අනෝන්" },
    { text: "සත්‍යය සැමවිටම ජය ගනී.", author: "අනෝන්" },
    { text: "ඔබව විශ්වාස කරන්න.", author: "අනෝන්" },
    { text: "කතාව අඩු කර වැඩ වැඩි කරන්න.", author: "අනෝන්" },
    { text: "ඔබේ වටිනාකම තීරණය කරන්නේ ඔබමය.", author: "අනෝන්" },
    { text: "සෑම දිනකම අලුත් යමක් ඉගෙන ගන්න.", author: "අනෝන්" },
    { text: "පැරදෙන මිනිසා අසාධාරණය ගැන කතා කරයි, දිනන මිනිසා අවස්ථාව ගැන කතා කරයි.", author: "අනෝන්" },
    { text: "ජීවිතය සටනකි, එය ජය ගන්න.", author: "අනෝන්" },
    { text: "කිසිම දෙයක් ලෙහෙසියෙන් ලැබෙන්නේ නැත.", author: "අනෝන්" },
    { text: "ලෝකය වෙනස් කිරීමට පෙර ඔබව වෙනස් කරන්න.", author: "අනෝන්" },
    { text: "ඔබ කවුදැයි පෙන්වීමට ක්‍රියා කරන්න.", author: "අනෝන්" },
    { text: "බිය යනු හුදු සිතුවිල්ලක් පමණි.", author: "අනෝන්" },
    { text: "අරමුණක් ඇති මිනිසාට ලෝකයම ඉඩ දෙයි.", author: "අනෝන්" },
    { text: "සමාජයට වටිනා මිනිසෙකු වන්න.", author: "ඇල්බට් අයින්ස්ටයින්" },
    { text: "ගමන ආරම්භ කරන්න, එවිට මාර්ගය පෙනෙනු ඇත.", author: "අනෝන්" },
    { text: "කඳු තරණය කරන්නා කිසිවිටෙකත් ආපසු නොබලයි.", author: "අනෝන්" },
    { text: "වෙහෙස නොබලා වැඩ කරන්න.", author: "අනෝන්" },
    { text: "ඉවසීම ජයග්‍රහණයේ රහසයි.", author: "අනෝන්" },
    { text: "කවදාවත් 'නැහැ' යන්න පිළිගන්න එපා.", author: "අනෝන්" },
    { text: "ඔබේ ශක්තිය අභ්‍යන්තරයේ පවතී.", author: "අනෝන්" },
    { text: "වෙනස් වන්න, නැතිනම් නැති වී යන්න.", author: "අනෝන්" },
    { text: "ජයග්‍රහණයේ රසය දන්නේ උත්සාහවන්තයා පමණි.", author: "අනෝන්" },
    { text: "ලස්සන හෙටක් වෙනුවෙන් අද වැඩ කරන්න.", author: "අනෝන්" },
    { text: "ඉලක්කය වෙතම අවධානය යොමු කරන්න.", author: "අනෝන්" },
    { text: "පරාජය යනු ජයග්‍රහණයේ පාඩමකි.", author: "අනෝන්" },
    { text: "සෑම විටම ධනාත්මකව සිතන්න.", author: "අනෝන්" },
    { text: "මිනිසාගේ ලොකුම සතුරා බියයි.", author: "අනෝන්" },
    { text: "තමන් ගැන විශ්වාසය තැබීම පළමු රහසයි.", author: "රැල්ෆ් වෝල්ඩෝ එමර්සන්" },
    { text: "වැඩ කරන්න, එවිට සියල්ල ඉටු වනු ඇත.", author: "අනෝන්" },
    { text: "අසාර්ථකත්වය හමුවේ සිනාසෙන්න.", author: "අනෝන්" },
    { text: "නිවැරදි දේ කිරීමට බිය නොවන්න.", author: "අනෝන්" },
    { text: "බලය ඇත්තේ ඔබේ අතේය.", author: "අනෝන්" },
    { text: "සාර්ථකත්වය පියවරෙන් පියවර පැමිණේ.", author: "අනෝන්" },
    { text: "හොඳ මිනිසෙකු වීමට උත්සාහ කරන්න.", author: "අනෝන්" },
    { text: "ඔබේ කාලය කළමනාකරණය කරන්න.", author: "අනෝන්" },
    { text: "තව එක් වරක් උත්සාහ කරන්න.", author: "අනෝන්" },
    { text: "දැනුම යනු බලයයි.", author: "ෆ්‍රැන්සිස් බේකන්" },
    { text: "නොනැවතී ඉදිරියටම යන්න.", author: "අනෝන්" },
    { text: "ජයග්‍රහණය උත්සාහවන්තයා සතුය.", author: "අනෝන්" },
    { text: "සෑම දෙයකම හොඳක් දකින්න.", author: "අනෝන්" },
    { text: "ධෛර්යවන්තයා ලොව ජය ගනී.", author: "අනෝන්" },
    { text: "දුෂ්කරතා මැදින් තරු කරා ගමන් කරන්න.", author: "සෙනෙකා" },
    { text: "ඔබේ සිතුවිලි වෙනස් කරන්න, එවිට ඔබ ඔබේ ලෝකය වෙනස් කරනු ඇත.", author: "නෝමන් වින්සන්ට් පීල්" },
    { text: "සාර්ථකත්වය යනු සැමවිටම ජයග්‍රහණය කිරීම නොව, කිසිදා පරාජය පිළිනොගැනීමයි.", author: "වින්ස් ලොම්බාර්ඩි" },
    { text: "අද දවසේ සූදානම හෙට දවසේ සාර්ථකත්වයේ පදනමයි.", author: "කොන්ෆියුසියස්" },
    { text: "අවස්ථාවන් එනතෙක් බලා නොසිටින්න, ඒවා නිර්මාණය කරන්න.", author: "ජෝර්ජ් බර්නාඩ් ෂෝ" },
    { text: "සෑම ප්‍රශ්නයකටම විසඳුමක් ඇත, ඔබ එය සොයාගත යුතුය.", author: "අනෝන්" },
    { text: "ඔබේ ජීවිතයේ වීරයා ඔබ වන්න.", author: "අනෝන්" },
    { text: "කුඩා පියවරවල් විශාල ගමන් වල ආරම්භයයි.", author: "ලාඕ ට්සු" },
    { text: "නොපෙනෙන ඉලක්කයක් කරා ගමන් කිරීම ධෛර්යයකි.", author: "අනෝන්" },
    { text: "වටිනා ඕනෑම දෙයකට කාලය වැය වේ.", author: "අනෝන්" },
    { text: "වෙනත් අයගේ මිනුම් දඬුවලින් ඔබව මනින්න එපා.", author: "අනෝන්" },
    { text: "විවේචනයට බිය නොවන්න, එය ඔබට ශක්තියක් කරගන්න.", author: "අනෝන්" },
    { text: "සැබෑ සතුට ඇත්තේ අනුන්ට උපකාර කිරීම තුළයි.", author: "අනෝන්" },
    { text: "ඔබේ ආශාව ඔබේ රැකියාව කරගන්න.", author: "අනෝන්" },
    { text: "වෙහෙස වී වැඩ කරන්න, නිහඬව ජයගන්න.", author: "අනෝන්" },
    { text: "ජීවිතය යනු අත්දැකීම් එකතුවකි.", author: "අනෝන්" },
    { text: "කිසිවිටෙකත් ඔබේ ප්‍රතිපත්ති පාවා නොදෙන්න.", author: "අනෝන්" },
    { text: "දිනන්න නම් මුලින්ම තරඟයට පිවිසිය යුතුය.", author: "අනෝන්" },
    { text: "ඔබේ අතීතය ඔබේ අනාගතය තීරණය කිරීමට ඉඩ නොදෙන්න.", author: "අනෝන්" },
    { text: "සෑම මොහොතකම වටිනාකම තේරුම් ගන්න.", author: "අනෝන්" },
    { text: "දක්ෂතාවයට වඩා විනය වැදගත් වේ.", author: "අනෝන්" },
    { text: "අන් අයව පාලනය කිරීමට පෙර ඔබව පාලනය කරන්න.", author: "අනෝන්" },
    { text: "බලාපොරොත්තුව යනු ලොව ඇති බලවත්ම දේය.", author: "අනෝන්" },
    { text: "නිරන්තර පුහුණුව ඔබව ප්‍රවීණයෙකු කරයි.", author: "අනෝන්" },
    { text: "අලුත් දේ අත්හදා බැලීමට බිය නොවන්න.", author: "අනෝන්" },
    { text: "ජීවිතය කෙටියි, සතුටින් ඉන්න.", author: "අනෝන්" },
    { text: "සාර්ථක මිනිසුන් සාමාන්‍ය මිනිසුන් නොකරන දේ කරයි.", author: "අනෝන්" },
    { text: "හොඳ පොතක් කියවීම මනසට ආහාරයකි.", author: "අනෝන්" },
    { text: "සෑම අසමත් වීමක්ම පාඩමකි.", author: "අනෝන්" },
    { text: "ඔබේ සිහිනවලට පියාපත් දෙන්න.", author: "අනෝන්" },
    { text: "ක්‍රියාවෙන් තොරව සිහින දකින්න එපා.", author: "අනෝන්" },
    { text: "සෑම උදෑසනකම අලුත් බලාපොරොත්තුවක් ඇති කරගන්න.", author: "අනෝන්" },
    { text: "ඉවසීමෙන් ඕනෑම බලකොටුවක් ජය ගත හැක.", author: "අනෝන්" },
    { text: "ජයග්‍රහණය යනු මානසික තත්වයකි.", author: "අනෝන්" },
    { text: "ලෝකයට ආලෝකයක් වන්න.", author: "අනෝන්" },
    { text: "සෑම විටම සත්‍යවාදී වන්න.", author: "අනෝන්" },
    { text: "අන් අයට ගරු කරන්න.", author: "අනෝන්" },
    { text: "ඔබේ ශරීරයට සහ මනසට ආදරය කරන්න.", author: "අනෝන්" },
    { text: "කෘතඥතාව යනු විශාල ගුණධර්මයකි.", author: "අනෝන්" },
    { text: "ජීවිතය නිරන්තර ඉගෙනුම් ක්‍රියාවලියකි.", author: "අනෝන්" },
    { text: "අසාර්ථකත්වය පර්යේෂණයක කොටසකි.", author: "අනෝන්" },
    { text: "වැඩ කල් දැමීම සාර්ථකත්වයේ සතුරායි.", author: "අනෝන්" },
    { text: "සෑම බාධකයක්ම අවස්ථාවක් කරගන්න.", author: "අනෝන්" },
    { text: "ඔබේ වටිනාකම ඔබම හඳුනාගන්න.", author: "අනෝන්" },
    { text: "නිවැරදි තීරණය නිවැරදි වෙලාවට ගන්න.", author: "අනෝන්" },
    { text: "පරාජය හමුවේ නොසැලෙන්න.", author: "අනෝන්" },
    { text: "ධනාත්මක මිනිසුන් ඇසුරු කරන්න.", author: "අනෝන්" },
    { text: "දැනුම බෙදා ගන්න, එය වැඩි වේ.", author: "අනෝන්" },
    { text: "විනෝදාංශයක් ඇති කරගන්න.", author: "අනෝන්" },
    { text: "ඔබේ හැකියාවන් ඔප් නංවා ගන්න.", author: "අනෝන්" },
    { text: "සාර්ථකත්වය යනු ගමනකි, ගමනාන්තයක් නොවේ.", author: "අනෝන්" },
    { text: "නිශ්ශබ්දතාවය ඇතැම් විට හොඳම පිළිතුරයි.", author: "අනෝන්" },
    { text: "වීරයෙකු වීමට විශාල දේවල් අවශ්‍ය නැත.", author: "අනෝන්" },
    { text: "සෑම අභියෝගයක්ම ඔබව ශක්තිමත් කරයි.", author: "අනෝන්" },
    { text: "ඔබේ හදවතට සවන් දෙන්න.", author: "අනෝන්" },
    { text: "කඩිසර වන්න, කම්මැලි නොවන්න.", author: "අනෝන්" },
    { text: "වගකීම් භාර ගැනීමට ඉගෙන ගන්න.", author: "අනෝන්" },
    { text: "විනය යනු නිදහසට මාවතයි.", author: "අනෝන්" },
    { text: "හොඳ සවන් දෙන්නෙකු වන්න.", author: "අනෝන්" },
    { text: "පරිසරයට ආදරය කරන්න.", author: "අනෝන්" },
    { text: "ඔබේ නිර්මාණශීලිත්වය අවදි කරන්න.", author: "අනෝන්" },
    { text: "සෑම විටම නිහතමානී වන්න.", author: "අනෝන්" },
    { text: "ජීවිතයේ සමතුලිතතාවය පවත්වා ගන්න.", author: "අනෝන්" },
    { text: "අන් අයගේ සාර්ථකත්වයට සතුටු වන්න.", author: "අනෝන්" },
    { text: "නිරෝගීකම උතුම්ම සම්පතයි.", author: "අනෝන්" },
    { text: "සමාජයට යහපතක් කරන්න.", author: "අනෝන්" },
    { text: "ඔබේ ගමන ගැන ආඩම්බර වන්න.", author: "අනෝන්" },
    { text: "සෑම දිනකම සිනාසෙන්න.", author: "අනෝන්" },
    { text: "දුක සැප දෙකම විඳගන්න.", author: "අනෝන්" },
    { text: "ඔබේ අරමුණ පැහැදිලි කරගන්න.", author: "අනෝන්" },
    { text: "අසාධාරණයට එරෙහි වන්න.", author: "අනෝන්" },
    { text: "ඔබේ වචනය රකින්න.", author: "අනෝන්" },
    { text: "මිත්‍රත්වය වටිනා සම්පතකි.", author: "අනෝන්" },
    { text: "සෑම මොහොතකම ජීවත් වන්න.", author: "අනෝන්" },
    { text: "පොත්පත් ඇසුරු කරන්න.", author: "අනෝන්" },
    { text: "සෑම දෙයකින්ම පාඩමක් ඉගෙන ගන්න.", author: "අනෝන්" },
    { text: "ධෛර්යය යනු බිය නොමැතිකම නොව, බිය ජය ගැනීමයි.", author: "නෙල්සන් මැන්ඩෙලා" },
    { text: "අනාගතය දකින්නෙකු වන්න.", author: "අනෝන්" },
    { text: "ඔබේ ආත්ම විශ්වාසය ඉහළ නංවා ගන්න.", author: "අනෝන්" },
    { text: "නොපසුබට උත්සාහය ජයග්‍රහණයේ රහසයි.", author: "අනෝන්" },
    { text: "මිනිසා යනු ඔහුගේ සිතුවිලි වල නිර්මාණයකි.", author: "මහත්මා ගාන්ධි" },
    { text: "හොඳ පුරුදු ඇති කරගන්න.", author: "අනෝන්" },
    { text: "වෙලාවට වැඩ කරන්න.", author: "අනෝන්" },
    { text: "පරිත්‍යාගය උතුම් ගුණයකි.", author: "අනෝන්" },
    { text: "අන් අයව දිරිමත් කරන්න.", author: "අනෝන්" },
    { text: "ඔබේ ඉලක්ක ලියා තබන්න.", author: "අනෝන්" },
    { text: "සෑම දෙයක්ම කළ හැකි බව විශ්වාස කරන්න.", author: "අනෝන්" },
    { text: "පරාජය පිළිගන්න, නමුත් උත්සාහය අත්නොහරින්න.", author: "අනෝන්" },
    { text: "නිර්භීත වන්න.", author: "අනෝන්" },
    { text: "සත්‍යය කතා කරන්න.", author: "අනෝන්" },
    { text: "ඔබේ මනස සන්සුන්ව තබා ගන්න.", author: "අනෝන්" },
    { text: "අන් අයට ආදර්ශයක් වන්න.", author: "අනෝන්" },
    { text: "ජීවිතය ලස්සනයි, එය විඳින්න.", author: "අනෝන්" },
    { text: "ඔබේ වගකීම ඉටු කරන්න.", author: "අනෝන්" },
    { text: "සෑම විටම ධර්මය රකින්න.", author: "අනෝන්" },
    { text: "සාර්ථකත්වය ඔබ අසලම ඇත.", author: "අනෝන්" },
    { text: "උත්සාහය අත්නොහරින්න.", author: "අනෝන්" },
    { text: "සෑම උදෑසනකම අලුත් ජවයකින් පිබිදෙන්න.", author: "අනෝන්" },
    { text: "ඔබේ සිහින සැබෑ කරගන්න.", author: "අනෝන්" },
    { text: "දිනන්න උපන් ඔබ පරාජය නොවන්න.", author: "අනෝන්" },
    { text: "සැබෑ ශක්තිය ඇත්තේ මාංශ පේශිවල නොව නොසැලෙන කැමැත්ත තුළයි.", author: "මහත්මා ගාන්ධි" },
    { text: "අන් අය කරන දේට වඩා හොඳින් කිරීමට උත්සාහ නොකරන්න, ඔබ කළ දේට වඩා හොඳින් කිරීමට උත්සාහ කරන්න.", author: "විලියම් ෆෝක්නර්" },
    { text: "සාර්ථකත්වය යනු අවසානය නොවේ; අසාර්ථකත්වය මාරාන්තික නොවේ; වැදගත් වන්නේ දිගටම කරගෙන යාමට ඇති ධෛර්යයයි.", author: "වින්ස්ටන් චර්චිල්" },
    { text: "සෑම මොහොතක්ම අලුත් ආරම්භයකි.", author: "ටී.එස්. එලියට්" },
    { text: "ඔබේ සිහින දකින්නන්ට නොව කරන්නන්ට ඉඩ දෙන්න.", author: "අනෝන්" },
    { text: "ඔබේ මනස සාරවත් උද්‍යානයක් මෙන් වගා කරන්න.", author: "අනෝන්" },
    { text: "නොපසුබට උත්සාහය යනු ඔබ කරන වෙහෙස මහන්සි වී වැඩ කිරීමෙන් පසු කරන වෙහෙස මහන්සි වී වැඩ කිරීමයි.", author: "නිව්ට් ගින්ග්‍රිච්" },
    { text: "ඔබේ ජීවිතයේ වගකීම භාරගන්න. ඔබ යන තැනට ඔබව ගෙන යන්නේ ඔබම බව දැනගන්න.", author: "ලෙස් බ්‍රවුන්" },
    { text: "විශිෂ්ටත්වය යනු ක්‍රියාවක් නොව පුරුද්දකි.", author: "ඇරිස්ටෝටල්" },
    { text: "අඳුරට ශාප කරනවාට වඩා එක ඉටිපන්දමක් දැල්වීම හොඳය.", author: "චීන ප්‍රස්ථාවිරුද්ධ" },
    { text: "ඔබට අවශ්‍ය ඕනෑම දෙයක් විය හැකිය, ඒ සඳහා කැපවීමට ඔබ සූදානම් නම්.", author: "අනෝන්" },
    { text: "අන් අයගේ සීමාවන් ඔබේ සිහින වලට බාධාවක් වීමට ඉඩ නොදෙන්න.", author: "අනෝන්" },
    { text: "නිහඬව සිටීමට ඉගෙන ගන්න, එවිට ඔබට සියල්ල ඇසෙනු ඇත.", author: "අනෝන්" },
    { text: "සෑම බාධකයක්ම ඔබේ ගමන ශක්තිමත් කරයි.", author: "අනෝන්" },
    { text: "අද දවසේ මහන්සිය හෙට දවසේ සතුටයි.", author: "අනෝන්" },
    { text: "අසාර්ථකත්වය යනු ජයග්‍රහණයට යන මාවතේ ඇති එක් නැවතුමක් පමණි.", author: "අනෝන්" },
    { text: "කඩිසරකම වාසනාවේ මවයි.", author: "බෙන්ජමින් ෆ්‍රෑන්ක්ලින්" },
    { text: "ඔබට ඔබව පාලනය කළ හැකි නම් ඔබට ලෝකයම පාලනය කළ හැකිය.", author: "අනෝන්" },
    { text: "සෑම මිනිසෙකුම තමන්ගේම ඉරණම නිර්මාණය කරන්නා වේ.", author: "අනෝන්" },
    { text: "ඉලක්කයක් නොමැති ගමනක් අතරමං වීමට වැඩි කාලයක් නොගනී.", author: "අනෝන්" },
    { text: "කාලය රන් හා සමානය, එය නිවැරදිව පාවිච්චි කරන්න.", author: "අනෝන්" },
    { text: "පරාජය හමුවේ නොසැලෙන මිනිසා සැබෑ වීරයෙකි.", author: "අනෝන්" },
    { text: "ඔබේ හැකියාවන් ගැන සැක නොකරන්න.", author: "අනෝන්" },
    { text: "කුඩා දේවල් විශිෂ්ට ලෙස කරන්න.", author: "අනෝන්" },
    { text: "සෑම දිනකම අලුත් දෙයක් ඉගෙන ගැනීම ජීවිතයට ආලෝකයකි.", author: "අනෝන්" },
    { text: "සාර්ථකත්වයට කෙටි මං නොමැත.", author: "අනෝන්" },
    { text: "ඉවසීම යනු සියලු ගැටලු වලට ඇති විසඳුමයි.", author: "අනෝන්" },
    { text: "මිනිසාගේ වටිනාකම තීරණය වන්නේ ඔහුගේ ගුණධර්ම මතයි.", author: "අනෝන්" },
    { text: "බය නැති මිනිසා නොව, බය ජයගන්නා මිනිසා ශක්තිමත්ය.", author: "අනෝන්" },
    { text: "ඔබේ සිහින සැබෑ කර ගැනීමට උත්සාහ කරන්න, නැතිනම් අනුන්ගේ සිහින සැබෑ කිරීමට ඔබට වැඩ කිරීමට සිදුවනු ඇත.", author: "ධිරුබායි අම්බානි" },
    { text: "ජීවිතය යනු රෝදයක් වැනිය, එය නිරන්තරයෙන් කැරකෙමින් පවතී.", author: "අනෝන්" },
    { text: "අද කරන වැඩ හෙටට කල් නොදමන්න.", author: "අනෝන්" },
    { text: "නිහතමානීකම ශ්‍රේෂ්ඨත්වයේ ලක්ෂණයකි.", author: "අනෝන්" },
    { text: "ධනයට වඩා බුද්ධිය වටී.", author: "අනෝන්" },
    { text: "යහපත් මිතුරන් ජීවිතයට ආශිර්වාදයකි.", author: "අනෝන්" },
    { text: "පරිසරය රැකගැනීම අප සැමගේ වගකීමකි.", author: "අනෝන්" },
    { text: "සෑම මල් පොහොට්ටුවක්ම පිපෙන්නට කාලය ගනී, කලබල නොවන්න.", author: "අනෝන්" },
    { text: "ජයග්‍රහණය යනු පරාජයන් සියයක එකතුවකි.", author: "අනෝන්" },
    { text: "ඔබේ මනස පිරිසිදුව තබාගන්න, එවිට සියල්ල පැහැදිලි වනු ඇත.", author: "අනෝන්" },
    { text: "වැටීම ස්වභාවිකයි, නමුත් නොනැගිට සිටීම පරාජයයි.", author: "අනෝන්" },
    { text: "අන් අයට ගරු කිරීමෙන් ඔබට ගරුත්වය ලැබේ.", author: "අනෝන්" },
    { text: "සෑම අඳුරු රාත්‍රියකටම පසු සුන්දර උදෑසනක් උදා වේ.", author: "අනෝන්" },
    { text: "විනය නොමැති තැන සාර්ථකත්වයක් නොමැත.", author: "අනෝන්" },
    { text: "පොත් කියවීමෙන් ලෝකය දකින්න.", author: "අනෝන්" },
    { text: "ඔබේ කාලය වැය කරන්නේ කා වෙනුවෙන්ද යන්න තීරණය කරන්න.", author: "අනෝන්" },
    { text: "සිහින දකින්න, ඒවා ක්‍රියාත්මක කරන්න.", author: "අනෝන්" },
    { text: "සැබෑ සතුට ඇත්තේ අභ්‍යන්තරයේය.", author: "අනෝන්" },
    { text: "නිරෝගී දිවිපෙවෙතක් ජයග්‍රහණයට මගයි.", author: "අනෝන්" },
    { text: "දැනුම යනු බෙදා දෙන තරමට වැඩිවන දෙයකි.", author: "අනෝන්" },
    { text: "කරුණාවන්ත වන්න, එය නොමිලේ දිය හැකි දෙයකි.", author: "අනෝන්" },
    { text: "ජීවිතයේ සෑම පියවරක්ම අත්දැකීමකි.", author: "අනෝන්" },
    { text: "ඔබේ අරමුණ උදේ පිබිදීමට හේතුවක් කරගන්න.", author: "අනෝන්" },
    { text: "සාර්ථකත්වය පියවරෙන් පියවර ගොඩනැගෙන්නකි.", author: "අනෝන්" },
    { text: "ධනාත්මක සිතුවිලි ඔබේ ජීවිතය වෙනස් කරයි.", author: "අනෝන්" },
    { text: "අන් අයගේ සාර්ථකත්වය දෙස බලා ඊර්ෂ්‍යා නොකරන්න, එයින් ඉගෙන ගන්න.", author: "අනෝන්" },
    { text: "පරාජය යනු නැවත උත්සාහ කිරීමට ලැබෙන අවස්ථාවකි.", author: "අනෝන්" },
    { text: "ඔබේ මනස ශක්තිමත් නම් ශරීරයට ඕනෑම දෙයක් කළ හැකිය.", author: "අනෝන්" },
    { text: "වචනයට වඩා ක්‍රියාව බලවත්ය.", author: "අනෝන්" },
    { text: "ලෝකයේ වෙනස වීමට ඔබටත් හැකිය.", author: "අනෝන්" },
    { text: "අද ඔබ ගන්නා තීරණ ඔබේ අනාගතය ලියයි.", author: "අනෝන්" },
    { text: "අත්නොහරින මිනිසා සැමවිටම ජයග්‍රහණය කරයි.", author: "අනෝන්" },
    { text: "සෑම දිනකම ඔබේ උපරිමය ලබා දෙන්න.", author: "අනෝන්" },
    { text: "සැබෑ දැනුම ඇත්තේ ප්‍රශ්න කිරීම තුළයි.", author: "සොක්‍රටීස්" },
    { text: "සාර්ථකත්වය යනු ඔබ කොපමණ ඉහළට ගියාද යන්න නොව, ඔබ ලෝකයට කොපමණ යහපතක් කළාද යන්නයි.", author: "අනෝන්" },
    { text: "ඔබේ සැබෑ තරඟකරුවා ඔබමය.", author: "අනෝන්" },
    { text: "වැරදි කිරීමෙන් පාඩම් ඉගෙන ගන්න.", author: "අනෝන්" },
    { text: "ජීවිතය කෙටි බැවින් එය අර්ථවත් දෙයකට යොදවන්න.", author: "අනෝන්" },
    { text: "ඔබේ ගමන සෙමින් වුවත්, නොනැවතී යන්න.", author: "අනෝන්" },
    { text: "විශ්වාසය යනු ජයග්‍රහණයේ අඩකි.", author: "අනෝන්" },
    { text: "සෑම දෙයක්ම හොඳම ආකාරයෙන් සිදුවන බව විශ්වාස කරන්න.", author: "අනෝන්" },
    { text: "කෘතඥතාවය හදවතේ මල් වත්තක් වැනිය.", author: "අනෝන්" },
    { text: "ඔබේ ආත්මය පිරිසිදුව තබාගන්න.", author: "අනෝන්" },
    { text: "සෑම මිනිසෙකු තුළම සැඟවුණු දක්ෂතාවයක් ඇත.", author: "අනෝන්" },
    { text: "ජයග්‍රහණයට අවශ්‍ය වන්නේ දක්ෂතාවය පමණක් නොව කැපවීමයි.", author: "අනෝන්" },
    { text: "සිනහව ඕනෑම රෝගයකට ඖෂධයකි.", author: "අනෝන්" },
    { text: "නිහඬව සිටීමෙන් බොහෝ ප්‍රශ්න විසඳේ.", author: "අනෝන්" },
    { text: "අසාධාරණයට එරෙහිව හඬ නගන්න.", author: "අනෝන්" },
    { text: "අන් අයට උදව් කිරීමෙන් ලැබෙන සතුට මිල කළ නොහැක.", author: "අනෝන්" },
    { text: "ඔබේ වගකීම නිවැරදිව ඉටු කරන්න.", author: "අනෝන්" },
    { text: "ජීවිතය සටනක් බවත් එය ජය ගත යුතු බවත් අමතක නොකරන්න.", author: "අනෝන්" },
    { text: "කෑමට පෙර මනසට ආහාර දෙන්න (කියවන්න).", author: "අනෝන්" },
    { text: "වැරදි හදාගෙන ඉදිරියට යන්න.", author: "අනෝන්" },
    { text: "ඔබේ දක්ෂතාවය ලෝකයට පෙන්වන්න.", author: "අනෝන්" },
    { text: "සාර්ථකත්වය යනු ඔබ ආදරය කරන දේ කිරීමයි.", author: "අනෝන්" },
    { text: "බිය පසෙකලා ඉදිරියටම යන්න.", author: "අනෝන්" },
    { text: "සෑම මොහොතකම සත්‍යය පවසන්න.", author: "අනෝන්" },
    { text: "විරෝධතා මැද වුවත් නිවැරදි දේ කරන්න.", author: "අනෝන්" },
    { text: "ධනයට වඩා ගුණය උතුම්ය.", author: "අනෝන්" },
    { text: "මිත්‍රත්වය රැකගන්න.", author: "අනෝන්" },
    { text: "සෑම මිනිසෙකුම සමානව සලකන්න.", author: "අනෝන්" },
    { text: "අරමුණක් ඇතිව ජීවත් වන්න.", author: "අනෝන්" },
    { text: "සෑම දිනකම සුළු වෙලාවක් භාවනා කරන්න.", author: "අනෝන්" },
    { text: "පරිත්‍යාගශීලී වන්න.", author: "අනෝන්" },
    { text: "ඔබේ ශරීරය දේවස්ථානයක් මෙන් පිරිසිදුව තබාගන්න.", author: "අනෝන්" },
    { text: "සාමය ඇත්තේ ඔබේ සිත තුළමය.", author: "අනෝන්" },
    { text: "වෙලාවට ගරු කරන්න.", author: "අනෝන්" },
    { text: "අන් අයව විවේචනය කිරීමට පෙර ඔබ දෙස බලන්න.", author: "අනෝන්" },
    { text: "කම්මැලිකම සාර්ථකත්වයේ සතුරායි.", author: "අනෝන්" },
    { text: "සෑම විටම කුතුහලයෙන් සිටින්න.", author: "අනෝන්" },
    { text: "අලුත් දේවල් සොයා යන්න.", author: "අනෝන්" },
    { text: "උත්සාහය ජයග්‍රහණයේ පියා වේ.", author: "අනෝන්" },
    { text: "කැපවීමෙන් තොරව ජයග්‍රහණයක් නැත.", author: "අනෝන්" },
    { text: "මිනිසාට කළ නොහැකි දෙයක් නැත.", author: "අනෝන්" },
    { text: "ධෛර්යය හදවතේ රත්තරන් වේ.", author: "අනෝන්" },
    { text: "සිනහවෙන් ලොව ජයගන්න.", author: "අනෝන්" },
    { text: "යහපත් පුරුදු ජීවිතය සාර්ථක කරයි.", author: "අනෝන්" },
    { text: "ඉවසීමෙන් ඕනෑම බලකොටුවක් ජයගත හැක.", author: "අනෝන්" },
    { text: "පරාජය පිළිනොගන්නා මිනිසා සැමදා ජයග්‍රාහකයෙකි.", author: "අනෝන්" },
    { text: "අද ඔබ වපුරන දේ හෙට අස්වනු ලෙස ලැබේ.", author: "අනෝන්" },
    { text: "දක්ෂතාවය පුහුණුවෙන් ඔප්නැංවේ.", author: "අනෝන්" },
    { text: "හොඳ මිනිසෙකු වීම සියල්ලටම වඩා වටී.", author: "අනෝන්" },
    { text: "කරුණාව හදවතේ භාෂාවයි.", author: "අනෝන්" },
    { text: "අවංකකම හොඳම ප්‍රතිපත්තියයි.", author: "අනෝන්" },
    { text: "කාලය කළමනාකරණය සාර්ථකත්වයේ රහසයි.", author: "අනෝන්" },
    { text: "ඔබේ සිහින වෙනුවෙන් සටන් කරන්න.", author: "අනෝන්" },
    { text: "කිසිවිටෙකත් බලාපොරොත්තු අත්නොහරින්න.", author: "අනෝන්" },
    { text: "ජීවිතය දෙස ධනාත්මකව බලන්න.", author: "අනෝන්" },
    { text: "විනයගරුක සමාජයක් ගොඩනගමු.", author: "අනෝන්" },
    { text: "දැනුම ඇති තැන බිය නැත.", author: "අනෝන්" },
    { text: "ලස්සන ලෝකයක් නිර්මාණය කිරීමට දායක වන්න.", author: "අනෝන්" },
    { text: "නොනැවතී ඉදිරියටම යන්න.", author: "අනෝන්" },
    { text: "සාර්ථකත්වය ඔබ අසලමය.", author: "අනෝන්" },
    { text: "ඔබව විශ්වාස කරන්න.", author: "අනෝන්" },
    { text: "සෑම ප්‍රශ්නයකටම විසඳුමක් ඇත.", author: "අනෝන්" },
    { text: "හොඳ හිත වර්ධනය කරගන්න.", author: "අනෝන්" },
    { text: "සත්‍යය සැමවිටම ජයගනී.", author: "අනෝන්" },
    { text: "නිහඬ බව තුළ ශක්තිය ඇත.", author: "අනෝන්" },
    { text: "අන් අයව දිරිමත් කරන්න.", author: "අනෝන්" },
    { text: "ගමන ආරම්භ කරන්න, මාර්ගය පෙනෙනු ඇත.", author: "අනෝන්" },
    { text: "ඔබේ හදවත පවසන දේ අහන්න.", author: "අනෝන්" },
    { text: "නිවැරදි දේ කිරීමට බිය නොවන්න.", author: "අනෝන්" },
    { text: "මිනිසා යනු ඔහුගේ සිතුවිලි වල ඵලයකි.", author: "අනෝන්" },
    { text: "කතාව අඩු කර වැඩ වැඩි කරන්න.", author: "අනෝන්" },
    { text: "ඉලක්කයක් තිබේ නම් මාවතක් ඇත.", author: "අනෝන්" },
    { text: "ඔබේ වටිනාකම ඔබම තීරණය කරන්න.", author: "අනෝන්" },
    { text: "අසාර්ථකත්වය හමුවේ සිනාසෙන්න.", author: "අනෝන්" },
    { text: "වෙහෙස මහන්සි වී වැඩ කරන්න.", author: "අනෝන්" },
    { text: "ජීවිතය අභියෝගයකි, එය ජය ගන්න.", author: "අනෝන්" },
    { text: "සාර්ථකත්වය යනු නිමක් නැති ගමනකි.", author: "අනෝන්" },
    { text: "තව එක් වරක් උත්සාහ කරන්න.", author: "අනෝන්" },
    { text: "පැරදීම ජයග්‍රහණයේ එක් පියවරකි.", author: "අනෝන්" },
    { text: "කවදාවත් 'බැහැ' කියන්න එපා.", author: "අනෝන්" },
    { text: "බලය ඇත්තේ ඔබේ මනස තුළය.", author: "අනෝන්" },
    { text: "හොඳ චරිතයක් ගොඩනගා ගන්න.", author: "අනෝන්" },
    { text: "පරාජය හමුවේ පසුබට නොවන්න.", author: "අනෝන්" },
    { text: "ඔබේ ලෝකය ඔබම නිර්මාණය කරගන්න.", author: "අනෝන්" },
    { text: "අන් අයට ආදර්ශයක් වන්න.", author: "අනෝන්" },
    { text: "වගකීම් භාරගැනීමට පසුබට නොවන්න.", author: "අනෝන්" },
    { text: "දක්ෂතාවයට වඩා උත්සාහය අගනේය.", author: "අනෝන්" },
    { text: "වෙනස් වන්න, ලෝකය වෙනස් කරන්න.", author: "අනෝන්" },
    { text: "සෑම දෙයකම හොඳක් දකින්න.", author: "අනෝන්" },
    { text: "ධෛර්යය ඇති තැන ජය ඇත.", author: "අනෝන්" },
    { text: "ඉවසීමෙන් ජයගන්න.", author: "අනෝන්" },
    { text: "කෘතඥ වන්න.", author: "අනෝන්" },
    { text: "ජීවිතය විඳින්න.", author: "අනෝන්" },
    { text: "ඔබේ අරමුණ කරා යන්න.", author: "අනෝන්" },
    { text: "පරාජයට බිය නොවන්න.", author: "අනෝන්" },
    { text: "උත්සාහය අත්නොහරින්න.", author: "අනෝන්" },
    { text: "සාර්ථකත්වය ඔබ අසලමය.", author: "අනෝන්" },
    { text: "හොඳ මිනිසෙකු වන්න.", author: "අනෝන්" },
    { text: "සත්‍යය කතා කරන්න.", author: "අනෝන්" },
    { text: "සමාජයට යහපතක් කරන්න.", author: "අනෝන්" },
    { text: "නිහතමානී වන්න.", author: "අනෝන්" },
    { text: "විනයගරුක වන්න.", author: "අනෝන්" },
    { text: "කඩිසර වන්න.", author: "අනෝන්" },
    { text: "ධෛර්යවන්ත වන්න.", author: "අනෝන්" },
    { text: "බලාපොරොත්තු ඇති කරගන්න.", author: "අනෝන්" },
    { text: "සෑම දිනකම සිනාසෙන්න.", author: "අනෝන්" },
    { text: "පරිසරයට ආදරය කරන්න.", author: "අනෝන්" },
    { text: "දැනුම සොයා යන්න.", author: "අනෝන්" },
    { text: "පොත් කියවන්න.", author: "අනෝන්" },
    { text: "හොඳ මිතුරන් ඇති කරගන්න.", author: "අනෝන්" },
    { text: "ඉවසීම පුහුණු කරන්න.", author: "අනෝන්" },
    { text: "විනෝදාංශයක් ඇති කරගන්න.", author: "අනෝන්" },
    { text: "නිරෝගීව සිටින්න.", author: "අනෝන්" },
    { text: "වෙලාවට වැඩ කරන්න.", author: "අනෝන්" },
    { text: "අරමුණක් ඇතිව ජීවත් වන්න.", author: "අනෝන්" },
    { text: "තමන්ව විශ්වාස කරන්න.", author: "අනෝන්" },
    { text: "නොනැවතී ඉදිරියට යන්න.", author: "අනෝන්" },
    { text: "ජයග්‍රහණය ඔබ සතුය.", author: "අනෝන්" },
    { text: "අලුත් දෙයක් අත්හදා බලන්න.", author: "අනෝන්" },
    { text: "හදවතට සවන් දෙන්න.", author: "අනෝන්" },
    { text: "නිහඬව වැඩ කරන්න.", author: "අනෝන්" },
    { text: "සාර්ථකත්වය සමරන්න.", author: "අනෝන්" },
    { text: "වැරදි හදාගන්න.", author: "අනෝන්" },
    { text: "ලෝකයට ආලෝකයක් වන්න.", author: "අනෝන්" },
    { text: "කරුණාව පතුරුවන්න.", author: "අනෝන්" },
    { text: "සෑම විටම සතුටින් ඉන්න.", author: "අනෝන්" },
    { text: "ජීවිතය අර්ථවත් කරන්න.", author: "අනෝන්" },
    { text: "ඔබේ ගමන සාර්ථක වේවා!", author: "අනෝන්" }
        ];

        const quoteText = document.getElementById("quote");
        const authorText = document.getElementById("author");
        const btnNext = document.getElementById("new-quote");
        const btnCopy = document.getElementById("copy-btn");
        const toast = document.getElementById("toast");

        btnNext.addEventListener("click", () => {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            quoteText.style.opacity = 0;
            authorText.style.opacity = 0;
            
            setTimeout(() => {
                quoteText.innerText = `"${quotes[randomIndex].text}"`;
                authorText.innerText = `- ${quotes[randomIndex].author}`;
                quoteText.style.opacity = 1;
                authorText.style.opacity = 1;
            }, 300);
        });

        btnCopy.addEventListener("click", () => {
            const fullText = `${quoteText.innerText} ${authorText.innerText}`;
            navigator.clipboard.writeText(fullText).then(() => {
                toast.className = "show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2500);
            });
        });
    </script>
</body>
</html>
